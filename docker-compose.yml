services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - kafka-net

  kafka-init:
    image: apache/kafka:3.7.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/kafka-init.sh"]
    volumes:
      - ./kafka-init.sh:/opt/kafka-init.sh:ro
    networks:
      - kafka-net

  fluent-bit:
    image: fluent/fluent-bit:3.2.2
    restart: unless-stopped
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./sensor_logs:/data/sensor_logs
      - ./runtime/fluent-bit/state:/fluent-bit/state
      - ./runtime/fluent-bit/storage:/fluent-bit/storage
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      logstash:
        condition: service_healthy
    networks:
      - kafka-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    restart: unless-stopped
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9600/_node/pipelines/main >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  stream-processor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "services.processor"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_TOPICS: factory.sensor.raw.json.v1,factory.sensor.raw.text.v1
      CLEAN_TOPIC: factory.sensor.clean.v1
      DLQ_TOPIC: factory.sensor.dlq.v1
      CONSUMER_GROUP: sensor-normalizer-v1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  stream-sink:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "services.sink"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLEAN_TOPIC: factory.sensor.clean.v1
      SINK_CONSUMER_GROUP: sensor-duckdb-sink-v1
      DUCKDB_PATH: /data/sensor.duckdb
    volumes:
      - ./data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  vector:
    profiles: ["aws"]
    image: timberio/vector:0.36.0-debian
    restart: unless-stopped
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_KEY:-}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka-data:
