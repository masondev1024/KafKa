# Vector's disk buffer is mounted at /var/lib/vector by the Compose profile.
data_dir: "/var/lib/vector"

# ====================================
# 1. 데이터 소스 (Kafka에서 읽기)
# Normalizer가 보증한 clean topic을 구독합니다.
# ====================================
sources:
  kafka_to_firehose_source:
    type: "kafka"
    bootstrap_servers: "kafka:9092"
    group_id: "vector-firehose-consumer-v1"
    auto_offset_reset: "earliest"
    decoding:
      codec: "json"
    topics: 
      - "factory.sensor.clean.v1"

# ====================================
# 2. 데이터 가공 (Transform)
# Firehose로 보내기 전, 중복 제거를 위한 ID 부여나 
# 추가 메타데이터(수집 시간 등)를 삽입할 수 있음
# ====================================
transforms:
  add_ingest_time:
    type: "remap"
    inputs: 
      - "kafka_to_firehose_source"
    source: |
      .vector_ingest_at = now()
      .pipeline = "factory-sensor-poc"


# ====================================
# 3. 데이터 목적지 (AWS Kinesis Firehose)
# ====================================
sinks:
  firehose_sink:
    type: "aws_kinesis_firehose"
    inputs: 
      - "add_ingest_time"
    region: "${AWS_REGION:-ap-northeast-2}"
    stream_name: "${FIREHOSE_STREAM_NAME:?FIREHOSE_STREAM_NAME must be set}"
    acknowledgements:
      enabled: true
    request_retry_partial: false
    batch:
      max_events: 500
      timeout_secs: 5
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"
    encoding:
      codec: "json"
