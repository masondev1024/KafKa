global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/prometheus-alerts.yml"

scrape_configs:
  - job_name: "sensor-processor"
    static_configs:
      - targets: ["stream-processor:9100"]

  - job_name: "sensor-sink"
    static_configs:
      - targets: ["stream-sink:9101"]
